<rect x="800" y="292" width="410" height="122" rx="8" fill="#FFFFFF" stroke="#9B2C2C" stroke-width="1.5"/>
<text x="814" y="316" font-size="15" font-weight="700" fill="#9B2C2C">資料不足的頁面</text>
<text x="814" y="340" font-size="13" fill="#2D3748">wiki 裡找不到足夠來源的投影片：</text>
<text x="814" y="362" font-size="13" fill="#2D3748">自動從大綱移除、記入 removed_nodes，</text>
<text x="814" y="384" font-size="13" fill="#2D3748">在下一個人工關卡（G1）一併報告。</text>
<text x="814" y="406" font-size="13" fill="#2D3748">不可以用自己的知識補內容。</text>
<rect x="800" y="546" width="410" height="100" rx="8" fill="#FFFFFF" stroke="#C05621" stroke-width="1.5"/>
<text x="814" y="570" font-size="15" font-weight="700" fill="#C05621">剎車機制</text>
<text x="814" y="594" font-size="13" fill="#2D3748">每個自動檢查最多退回 3 次；</text>
<text x="814" y="616" font-size="13" fill="#2D3748">第 3 次仍不通過 → 停下，交給人處理。</text>
<text x="814" y="638" font-size="13" fill="#2D3748">人工修改不計入，修改後次數重新計算。</text>
<rect x="800" y="726" width="410" height="122" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
<text x="814" y="750" font-size="15" font-weight="700" fill="#2B6CB0">每頁投影片（新人自學）</text>
<text x="814" y="774" font-size="13" fill="#2D3748">學習目標、重點（附條號）、圖、</text>
<text x="814" y="796" font-size="13" fill="#2D3748">一題單選自我檢查：點選後顯示對錯、</text>
<text x="814" y="818" font-size="13" fill="#2D3748">解說和條號連結。題目和答案都要</text>
<text x="814" y="840" font-size="13" fill="#2D3748">對得到 wiki；不記錄學員進度。</text>
<rect x="800" y="1142" width="410" height="100" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/>
<text x="814" y="1166" font-size="15" font-weight="700" fill="#4A5568">檢查方式</text>
<text x="814" y="1190" font-size="13" fill="#2D3748">程式：條號、連結、字數、頁數、截圖</text>
<text x="814" y="1212" font-size="13" fill="#2D3748">獨立審查：另一個 agent 只看產物，</text>
<text x="814" y="1234" font-size="13" fill="#2D3748">判斷內容是否忠於 wiki、是否看得懂</text>
<rect x="40" y="1464" width="26" height="18" rx="4" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/>
<text x="74" y="1478" font-size="14" fill="#2D3748">節點（產生產物）</text>
<rect x="250" y="1464" width="26" height="18" rx="4" fill="#FFF4E5" stroke="#C05621" stroke-width="2"/>
<text x="284" y="1478" font-size="14" fill="#2D3748">自動檢查</text>
<rect x="460" y="1464" width="26" height="18" rx="4" fill="#EDF7ED" stroke="#2F855A" stroke-width="2"/>
<text x="494" y="1478" font-size="14" fill="#2D3748">人工確認關卡</text>
<text x="40" y="1508" font-size="13" fill="#4A5568">wiki 更新時：比對 source_pack 記錄的來源頁雜湊，有變動就從 N1 重跑，下游產物標為過期。</text>
</svg>