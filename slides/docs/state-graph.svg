<text x="319.0" y="404" font-size="17" font-weight="700" fill="#C05621">○ C1</text>
<text x="379.0" y="404" font-size="17" font-weight="700" fill="#1A202C">檢查取材</text>
<text x="379.0" y="426" font-size="13" fill="#4A5568">reports/C1.json</text>
<rect x="305.0" y="466.0" width="330" height="56" rx="6" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/>
<text x="319.0" y="490" font-size="17" font-weight="700" fill="#2B6CB0">■ N2</text>
<text x="379.0" y="490" font-size="17" font-weight="700" fill="#1A202C">大綱</text>
<text x="379.0" y="512" font-size="13" fill="#4A5568">outline.json ＋ outline.md</text>
<rect x="305.0" y="552.0" width="330" height="56" rx="16" fill="#FFF4E5" stroke="#C05621" stroke-width="2"/>
<text x="319.0" y="576" font-size="17" font-weight="700" fill="#C05621">○ C2</text>
<text x="379.0" y="576" font-size="17" font-weight="700" fill="#1A202C">檢查大綱</text>
<text x="379.0" y="598" font-size="13" fill="#4A5568">reports/C2.json</text>
<rect x="305.0" y="638.0" width="330" height="56" rx="28" fill="#EDF7ED" stroke="#2F855A" stroke-width="2"/>
<text x="319.0" y="662" font-size="17" font-weight="700" fill="#2F855A">◆ G1</text>
<text x="379.0" y="662" font-size="17" font-weight="700" fill="#1A202C">人：確認大綱</text>
<text x="379.0" y="684" font-size="13" fill="#4A5568">回報被移除的頁面</text>
<rect x="305.0" y="724.0" width="330" height="56" rx="6" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/>
<text x="319.0" y="748" font-size="17" font-weight="700" fill="#2B6CB0">■ N3</text>
<text x="379.0" y="748" font-size="17" font-weight="700" fill="#1A202C">製作投影片</text>
<text x="379.0" y="770" font-size="13" fill="#4A5568">safety_training_deck.html</text>
<rect x="305.0" y="810.0" width="330" height="56" rx="16" fill="#FFF4E5" stroke="#C05621" stroke-width="2"/>
<text x="319.0" y="834" font-size="17" font-weight="700" fill="#C05621">○ C3</text>
<text x="379.0" y="834" font-size="17" font-weight="700" fill="#1A202C">檢查投影片</text>
<text x="379.0" y="856" font-size="13" fill="#4A5568">reports/C3.json</text>
<rect x="305.0" y="896.0" width="330" height="56" rx="28" fill="#EDF7ED" stroke="#2F855A" stroke-width="2"/>
<text x="319.0" y="920" font-size="17" font-weight="700" fill="#2F855A">◆ G2</text>
<text x="379.0" y="920" font-size="17" font-weight="700" fill="#1A202C">人：試用</text>
<text x="379.0" y="942" font-size="13" fill="#4A5568">自己操作一次</text>
<rect x="305.0" y="982.0" width="330" height="56" rx="6" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/>
