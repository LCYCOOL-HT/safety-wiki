<text x="379.0" y="168" font-size="13" fill="#4A5568">brief.md</text>
<rect x="305.0" y="208.0" width="330" height="56" rx="28" fill="#EDF7ED" stroke="#2F855A" stroke-width="2"/>
<text x="319.0" y="232" font-size="17" font-weight="700" fill="#2F855A">◆ G0</text>
<text x="379.0" y="232" font-size="17" font-weight="700" fill="#1A202C">人：確認規格</text>
<text x="379.0" y="254" font-size="13" fill="#4A5568">通過才往下</text>
<rect x="305.0" y="294.0" width="330" height="56" rx="6" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/>
<text x="319.0" y="318" font-size="17" font-weight="700" fill="#2B6CB0">■ N1</text>
<text x="379.0" y="318" font-size="17" font-weight="700" fill="#1A202C">取材（只讀 wiki）</text>
<text x="379.0" y="340" font-size="13" fill="#4A5568">source_pack.json</text>
